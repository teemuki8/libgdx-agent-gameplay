name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK 25 / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Check GL-free core
        run: ./gradlew :gameplay-core:clean :gameplay-core:check --warning-mode=fail
      - name: Check adapters under Xvfb
        run: >-
          xvfb-run -a ./gradlew
          :gameplay-libgdx:check :gameplay-runtime:check :gameplay-box2d:check
          --warning-mode=fail
      - name: Check real fixture and MCP
        run: xvfb-run -a ./gradlew :gameplay-fixture:check --warning-mode=fail
      - name: Check full publication contract
        run: >-
          xvfb-run -a ./gradlew clean check javadoc apiCompatibility
          verifyPublicationArchives verifyPublishedPoms --warning-mode=fail
      - name: Verify isolated Maven consumer
        run: ./scripts/verify-maven-local.sh
      - name: Retain bounded failed reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-reports-linux
          retention-days: 14
          if-no-files-found: warn
          path: |
            **/build/reports/**
            **/build/test-results/**
